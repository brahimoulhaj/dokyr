# Typed queries for internal/store. `make sqlc` regenerates internal/store/sqlcgen from
# the queries in internal/store/queries against internal/store/schema.sql (a snapshot of
# the migrated database, kept current by TestSchemaSnapshot). Stores move here one at a
# time; the ones not listed in queries/ still write their SQL in Go.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/schema.sql
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        emit_empty_slices: true
