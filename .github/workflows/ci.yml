name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Web app (typecheck and build)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go vet
        run: go vet ./...
      # -short skips the tests that need a Docker daemon and a Caddy container.
      - name: Go test
        run: go test -short -race ./...

      - name: Installer renders
        run: make installer VERSION=ci && sh -n bin/install.sh
